# vim: ft=tmux

%hidden custom_black="#000000"
%hidden custom_bg="#405050"
%hidden custom_fg="#b5b5b5"
%hidden custom_yellow="#f0b910"
%hidden custom_red="#f57876"
%hidden custom_session="#e5c695"
%hidden custom_selected="#f2f2f2"

#set-hook -g client-dark-theme "run-shell path/to/script.sh dark"
#set-hook -g client-light-theme "run-shell path/to/script.sh light"

# Select color
set -g mode-style "bg=$custom_yellow,fg=$custom_black"
set -g copy-mode-match-style "bg=$custom_yellow,fg=$custom_black"
set -g copy-mode-current-match-style "bg=$custom_red,fg=$custom_black,bold"
set -g copy-mode-mark-style "bg=terminal,fg=green,reverse,bold"

# Messages
set -g message-style "bg=$custom_yellow,fill=$custom_yellow,fg=$custom_black"

# Status
set -g status-position bottom
set -g status-left " #[fg=$custom_session,bold]#S"
set -g status-left-length 16

set -g window-status-separator ""
set -g window-status-format "  #I:#{?window_zoomed_flag,[Z]:,}#W"
set -g window-status-current-format "  #[bold]#I:#{?window_zoomed_flag,[Z]:,}#W#[nobold]"

set -g status-style "bg=$custom_bg,fg=$custom_fg"
set -g window-status-current-style "fg=$custom_selected"
set -g window-status-bell-style "fg=$custom_red"
set -g window-status-activity-style "fg=$custom_yellow"

# Status Right
set -g status-right-length 70
set -g status-right "#[bold]#{?client_prefix, #[fg=$custom_red][P]#[fg=$custom_fg] ,}#{?pane_mode, [#{pane_mode}] ,}#{?rectangle_toggle, [Rect] ,}"
set -ga status-right "#{?pane_pipe, [Piping Output] ,}#{?pane_synchronized, #[fg=$custom_red][Sync]#[fg=$custom_fg] ,}#[nobold]"
set -ga status-right "#{=/-42/…:pane_title} | #[fg=orange]#h#[default] %z "
