# vim: ft=tmux

# SHOW OPTIONS:
# tmux list-keys | less
# tmux show -gw | less

# Set a pane option with -p, a window option with -w, a server option with -s, otherwise a session option.
# If -g is given, a global session or window option is set.

# Some apps may render incorrectly with xterm-256color
# tmux defaults to 'set -g default-terminal "tmux-256color"' if available

# RGB for true-color
# usstyle for undercurl color
set -as terminal-features "*:RGB:usstyle"

set -g history-limit 200000
set -g mode-keys vi
set -g status-keys emacs
set -g escape-time 10
set -g extended-keys on
set -g wrap-search off  # do not wrap around at the end/start
set -g detach-on-destroy off  # switch to another session if current one is destroyed
set -g allow-rename on
set -g word-separators ",│`|:\"' ()[]{}<>\t"
set -g allow-passthrough on

set -g base-index 1
set -g pane-base-index 1
set -g aggressive-resize on
set -g renumber-windows on

# Titles
set -g set-titles on
set -g set-titles-string " #I:#{?window_zoomed_flag,[Z]:,}#W  |  #{pane_title} " # title for the terminal
set -g automatic-rename on  # Uses CPU
set -g automatic-rename-format "#{pane_current_command}"

set -g status on
set -g status-interval 10
set -g display-time 2000
set -g display-panes-time 1000
set -g focus-events on  # pass focus events to apps

set -g monitor-activity on
set -g visual-activity off # no msg on activity
set -g visual-bell off
set -g activity-action none
set -g bell-action any

set -g mouse on
set -g set-clipboard on # 'on' is required for OSC52
set -g copy-command "$CLIPBOARD_COPY"

source -F "#{d:current_file}/theme.conf"
source -F "#{d:current_file}/mappings/main.conf"
source -F "#{d:current_file}/mappings/copy-mode.conf"
